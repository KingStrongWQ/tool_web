<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间戳转化工具</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: linear-gradient(135deg, #eaf3ff 0%, #dbeafe 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 16px;
        color: #263238;
    }

    .container {
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 18px 50px rgba(37, 99, 235, 0.14);
        max-width: 560px;
        width: 100%;
        padding: 30px;
    }

    h1 {
        text-align: center;
        margin-bottom: 8px;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 1px;
        background: linear-gradient(135deg, #1d4ed8, #3b82f6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .section {
        margin-top: 20px;
        padding: 18px;
        background: #f4f8ff;
        border: 1px solid #dbe7fb;
        border-radius: 14px;
        box-shadow: 0 8px 22px rgba(37, 99, 235, 0.06);
    }

    h2 {
        font-size: 17px;
        color: #1d4ed8;
        margin-bottom: 12px;
        font-weight: 700;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="time"] {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid #d7e3f8;
        border-radius: 10px;
        margin-bottom: 13px;
        font-size: 15px;
        color: #172554;
        background: #ffffff;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="date"]:focus,
    input[type="time"]:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
    }

    .date-time-inputs {
        display: flex;
        gap: 14px;
        margin-bottom: 13px;
    }

    .date-time-inputs input {
        flex: 1;
        margin-bottom: 0;
    }

    button {
        width: 100%;
        padding: 11px 20px;
        background: linear-gradient(135deg, #2563eb, #4f8bf8);
        color: #ffffff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 700;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.22);
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 22px rgba(37, 99, 235, 0.28);
    }

    .result {
        margin-top: 13px;
        padding: 14px;
        background: #eef5ff;
        border: 1px solid #d3e5ff;
        border-radius: 12px;
        word-wrap: break-word;
        font-size: 15px;
        font-weight: 600;
        color: #172554;
    }

    .back-link {
        display: inline-block;
        margin-top: 22px;
        padding: 9px 20px;
        color: #2563eb;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        border: 1px solid #cfe0fb;
        border-radius: 12px;
        transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .back-link:hover {
        background: #2563eb;
        color: #ffffff;
        transform: translateY(-2px);
    }

    @media (max-width: 768px) {
        .container {
            padding: 22px;
        }

        .date-time-inputs {
            flex-direction: column;
        }
    }
</style>
</head>
<body>
    <div class="container">
        <h1>时间戳转化工具</h1>
        
        <!-- 时间戳转日期时间 -->
        <div class="section">
            <h2>时间戳转日期时间</h2>
            <input type="number" id="timestamp" placeholder="输入时间戳（秒）">
            <button onclick="convertTimestampToDateTime()">转化</button>
            <div class="result" id="dateTimeResult"></div>
        </div>
        
        <!-- 日期时间转时间戳 -->
        <div class="section">
            <h2>日期时间转时间戳</h2>
            <div class="date-time-inputs">
                <input type="date" id="date">
                <input type="time" id="time">
            </div>
            <button onclick="convertDateTimeToTimestamp()">转化</button>
            <div class="result" id="timestampResult"></div>
        </div>
        
        <a href="../index.html" class="back-link">返回主页</a>
    </div>
    
    <script>
        function convertTimestampToDateTime() {
            const timestamp = document.getElementById('timestamp').value;
            if (!timestamp) {
                document.getElementById('dateTimeResult').textContent = '请输入时间戳';
                return;
            }
            
            const date = new Date(parseInt(timestamp) * 1000);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            
            const result = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            document.getElementById('dateTimeResult').textContent = result;
        }
        
        function convertDateTimeToTimestamp() {
            const dateInput = document.getElementById('date').value;
            const timeInput = document.getElementById('time').value;
            
            if (!dateInput || !timeInput) {
                document.getElementById('timestampResult').textContent = '请选择日期和时间';
                return;
            }
            
            const dateTimeString = `${dateInput} ${timeInput}`;
            const timestamp = Math.floor(new Date(dateTimeString).getTime() / 1000);
            document.getElementById('timestampResult').textContent = timestamp;
        }
        
        // 初始化当前日期时间
        function initDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('date').value = `${year}-${month}-${day}`;
            document.getElementById('time').value = `${hours}:${minutes}`;
        }
        
        // 页面加载时初始化
        window.onload = initDateTime;
    </script>
</body>
</html>
