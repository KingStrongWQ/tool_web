<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单位换算小工具</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 16px;
        color: #263238;
    }

    .container {
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 18px 50px rgba(16, 185, 129, 0.14);
        max-width: 620px;
        width: 100%;
        padding: 30px;
    }

    h1 {
        text-align: center;
        margin-bottom: 8px;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 1px;
        background: linear-gradient(135deg, #059669, #10b981);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .section {
        margin-top: 20px;
        padding: 18px;
        background: #f4fbf7;
        border: 1px solid #d9efe4;
        border-radius: 14px;
        box-shadow: 0 8px 22px rgba(5, 150, 105, 0.06);
    }

    h2 {
        font-size: 17px;
        color: #047857;
        margin-bottom: 12px;
        font-weight: 700;
    }

    .unit-type-selector {
        margin-bottom: 0;
    }

    .unit-type-selector select {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid #d2eadf;
        border-radius: 10px;
        font-size: 15px;
        color: #064e3b;
        background: #ffffff;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .unit-type-selector select:focus {
        outline: none;
        border-color: #10b981;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
    }

    .conversion-section {
        display: flex;
        gap: 18px;
        align-items: flex-start;
    }

    .input-group {
        flex: 1;
        min-width: 0;
    }

    input[type="number"] {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid #d2eadf;
        border-radius: 10px;
        margin-bottom: 13px;
        font-size: 15px;
        color: #064e3b;
        background: #ffffff;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="number"]:focus {
        outline: none;
        border-color: #10b981;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
    }

    select {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid #d2eadf;
        border-radius: 10px;
        font-size: 15px;
        color: #064e3b;
        background: #ffffff;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    select:focus {
        outline: none;
        border-color: #10b981;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
    }

    .result {
        margin-top: 0;
        padding: 16px;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 12px;
        word-wrap: break-word;
    }

    .result h3 {
        font-size: 14px;
        color: #047857;
        margin-bottom: 8px;
        font-weight: 700;
    }

    .result-value {
        font-size: 20px;
        font-weight: 700;
        color: #065f46;
        background: linear-gradient(135deg, #059669, #10b981);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .back-link {
        display: inline-block;
        margin-top: 22px;
        padding: 9px 20px;
        color: #059669;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        border: 1px solid #d2eadf;
        border-radius: 12px;
        transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .back-link:hover {
        background: #059669;
        color: #ffffff;
        transform: translateY(-2px);
    }

    @media (max-width: 768px) {
        .container {
            padding: 22px;
        }

        .conversion-section {
            flex-direction: column;
        }
    }
</style>
</head>
<body>
    <div class="container">
        <h1>单位换算小工具</h1>
        
        <div class="section">
            <h2>选择单位类型</h2>
            <div class="unit-type-selector">
                <select id="unitType" onchange="updateUnitOptions()">
                    <option value="length">长度</option>
                    <option value="mass">质量</option>
                    <option value="power">功率</option>
                    <option value="energy">热量</option>
                    <option value="speed">速度</option>
                </select>
            </div>
        </div>
        
        <div class="section">
            <h2>换算设置</h2>
            <div class="conversion-section">
                <div class="input-group">
                    <input type="number" id="inputValue" placeholder="输入数值" oninput="convertUnits()">
                    <select id="fromUnit" onchange="convertUnits()"></select>
                </div>
                <div class="input-group">
                    <input type="number" id="outputValue" readonly>
                    <select id="toUnit" onchange="convertUnits()"></select>
                </div>
            </div>
        </div>
        
        <div class="section">
            <div class="result">
                <h3>换算结果</h3>
                <div class="result-value" id="resultText"></div>
            </div>
        </div>
        
        <a href="../index.html" class="back-link">返回主页</a>
    </div>
    
    <script>
        // 单位定义
        const unitDefinitions = {
            length: {
                units: ['米 (m)', '千米 (km)', '厘米 (cm)', '毫米 (mm)', '英寸 (in)', '英尺 (ft)', '英里 (mi)'],
                conversions: {
                    '米 (m)': 1,
                    '千米 (km)': 0.001,
                    '厘米 (cm)': 100,
                    '毫米 (mm)': 1000,
                    '英寸 (in)': 39.3701,
                    '英尺 (ft)': 3.28084,
                    '英里 (mi)': 0.000621371
                }
            },
            mass: {
                units: ['千克 (kg)', '克 (g)', '毫克 (mg)', '吨 (t)', '磅 (lb)', '盎司 (oz)'],
                conversions: {
                    '千克 (kg)': 1,
                    '克 (g)': 1000,
                    '毫克 (mg)': 1000000,
                    '吨 (t)': 0.001,
                    '磅 (lb)': 2.20462,
                    '盎司 (oz)': 35.274
                }
            },
            power: {
                units: ['瓦特 (W)', '千瓦 (kW)', '马力 (hp)', '焦耳/秒 (J/s)'],
                conversions: {
                    '瓦特 (W)': 1,
                    '千瓦 (kW)': 0.001,
                    '马力 (hp)': 0.00134102,
                    '焦耳/秒 (J/s)': 1
                }
            },
            energy: {
                units: ['焦耳 (J)', '千焦耳 (kJ)', '卡路里 (cal)', '大卡 (kcal)', '千瓦时 (kWh)'],
                conversions: {
                    '焦耳 (J)': 1,
                    '千焦耳 (kJ)': 0.001,
                    '卡路里 (cal)': 0.239006,
                    '大卡 (kcal)': 0.000239006,
                    '千瓦时 (kWh)': 2.77778e-7
                }
            },
            speed: {
                units: ['米/秒 (m/s)', '千米/小时 (km/h)', '英里/小时 (mph)', '节 (kn)'],
                conversions: {
                    '米/秒 (m/s)': 1,
                    '千米/小时 (km/h)': 3.6,
                    '英里/小时 (mph)': 2.23694,
                    '节 (kn)': 1.94384
                }
            }
        };
        
        // 更新单位选项
        function updateUnitOptions() {
            const unitType = document.getElementById('unitType').value;
            const fromUnitSelect = document.getElementById('fromUnit');
            const toUnitSelect = document.getElementById('toUnit');
            const units = unitDefinitions[unitType].units;
            
            // 清空现有选项
            fromUnitSelect.innerHTML = '';
            toUnitSelect.innerHTML = '';
            
            // 添加新选项
            units.forEach(unit => {
                const fromOption = document.createElement('option');
                fromOption.value = unit;
                fromOption.textContent = unit;
                fromUnitSelect.appendChild(fromOption);
                
                const toOption = document.createElement('option');
                toOption.value = unit;
                toOption.textContent = unit;
                toUnitSelect.appendChild(toOption);
            });
            
            // 默认选择不同的单位
            if (units.length > 1) {
                toUnitSelect.selectedIndex = 1;
            }
            
            // 触发换算
            convertUnits();
        }
        
        // 单位换算
        function convertUnits() {
            const unitType = document.getElementById('unitType').value;
            const inputValue = parseFloat(document.getElementById('inputValue').value) || 0;
            const fromUnit = document.getElementById('fromUnit').value;
            const toUnit = document.getElementById('toUnit').value;
            const conversions = unitDefinitions[unitType].conversions;
            
            // 先转换为基准单位（第一个单位），再转换为目标单位
            const baseValue = inputValue / conversions[fromUnit];
            const outputValue = baseValue * conversions[toUnit];
            
            // 更新输出
            document.getElementById('outputValue').value = outputValue.toFixed(6);
            document.getElementById('resultText').textContent = `${inputValue} ${fromUnit} = ${outputValue.toFixed(6)} ${toUnit}`;
        }
        
        // 初始化
        window.onload = function() {
            updateUnitOptions();
        };
    </script>
</body>
</html>
